<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>RetroShelf</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="logo"><img src="logo.svg" alt="" width="30" height="30">RETROSHELF</div>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="lib">라이브러리</button>
    <button class="tab" role="tab" data-tab="emu">에뮬레이터</button>
    <button class="tab" role="tab" data-tab="stats">통계</button>
    <button class="tab" role="tab" data-tab="scan">스캔·설정</button>
  </nav>
  <div class="stats" id="stats"></div>
  <button class="btn" id="rescanBtn" title="등록한 폴더를 모두 다시 스캔">다시 스캔</button>
  <button class="btn primary" id="addBtn">폴더 추가</button>
</header>

<div class="app" id="app">
  <aside class="side" id="side"></aside>
  <main id="main"></main>
</div>

<div id="overlay"></div>
<div id="alert" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="bridge.js"></script>
<script src="data.js"></script>
<script src="carts.js"></script>
<script src="app.js"></script>
</body>
</html>
